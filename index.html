<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TXT → EPUB 转换器（带目录）</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="brandbar"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5a2 2 0 0 1 2-2h6v18H6a2 2 0 0 1-2-2z"/>
          <path d="M20 5a2 2 0 0 0-2-2h-4v18h4a2 2 0 0 0 2-2z" opacity="0.5"/>
          <path d="M13 12h6m0 0-2-2m2 2-2 2"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>TXT <span class="arrow">→</span> EPUB</h1>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- 左：输入与设置 -->
    <section class="panel">
      <div class="step"><span class="step-no">1</span><h2>导入文本</h2></div>
      <div id="drop" class="dropzone">
        <svg class="dz-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4m0 0L8 8m4-4 4 4"/>
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        <p>拖入 .txt 文件，或 <label class="link">点击选择<input id="file" type="file" accept=".txt,text/plain" hidden/></label></p>
      </div>
      <details class="paste">
        <summary>或粘贴文本</summary>
        <textarea id="paste" rows="6" placeholder="在此粘贴文本内容…"></textarea>
        <button id="usePaste" class="btn ghost">使用粘贴内容</button>
      </details>

      <div class="step"><span class="step-no">2</span><h2>转换设置</h2></div>
      <div class="field">
        <label>编码</label>
        <select id="encoding">
          <option value="auto">自动检测（推荐）</option>
          <option value="utf-8">UTF-8</option>
          <option value="gb18030">GB18030 / GBK（简体中文）</option>
          <option value="utf-16">UTF-16（带 BOM，记事本「Unicode」）</option>
          <option value="shift_jis">Shift_JIS（日文）</option>
        </select>
        <span id="detectedEncoding" class="hint"></span>
      </div>
      <div class="field">
        <label class="chk">
          <input id="separators" type="checkbox"/>
          把分隔线（=== / --- / ***）也当作章节切分
        </label>
      </div>
      <div class="field">
        <label class="chk">
          <input id="numbered" type="checkbox"/>
          识别数字编号标题（1. / 1.1 / 2、 / 3) 等）
        </label>
      </div>
      <div class="field">
        <label>段落切分</label>
        <select id="paragraphMode">
          <option value="auto">自动（按空行/按行自适应）</option>
          <option value="block">按空行分段</option>
          <option value="line">每行一段</option>
        </select>
      </div>
      <div class="field custom-rule">
        <label>自定义章节规则（可选）</label>
        <div class="rule-input">
          <input id="customExample" type="text" placeholder="粘贴一行示例标题，如：第一章 风起云涌"/>
          <button id="addRule" class="btn tiny" type="button">添加</button>
        </div>
        <p class="hint">识别不了的特殊标题？贴一行示例，工具自动学会同类标题（叠加在默认规则之上，不替换默认）。</p>
        <div id="customRules" class="custom-rules"></div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>书名</label>
          <input id="title" type="text" placeholder="默认取文件名"/>
        </div>
        <div class="field">
          <label>作者</label>
          <input id="author" type="text" placeholder="佚名"/>
        </div>
      </div>
      <div class="field cover-field">
        <label>自定义封面（可选）</label>
        <div class="cover-upload">
          <label class="btn ghost cover-btn">
            选择封面图片
            <input id="cover" type="file" accept="image/*" hidden/>
          </label>
          <button id="autoCover" class="btn tiny" type="button">生成文字封面</button>
          <button id="clearCover" class="btn tiny" type="button" style="display:none">清除封面</button>
          <span id="coverName" class="hint"></span>
        </div>
        <div id="coverPreviewWrap" class="cover-preview" style="display:none">
          <img id="coverPreview" alt="封面预览"/>
        </div>
      </div>
      <button id="detect" class="btn secondary">检测标题</button>
      <p id="detectInfo" class="hint"></p>
    </section>

    <!-- 右：目录校正与生成 -->
    <section class="panel">
      <div class="step"><span class="step-no">3</span><h2>校正目录</h2></div>
      <div class="toolbar">
        <button id="selectAll" class="btn tiny">全选</button>
        <button id="selectNone" class="btn tiny">全不选</button>
        <span class="hint">层级：▲ 升一级（更内嵌）｜▼ 降一级</span>
      </div>
      <div id="tocList" class="toc-list">
        <p class="empty">尚未检测。请先导入文本并点击「检测标题」。</p>
      </div>

      <h2 class="preview-title">目录结构预览</h2>
      <div id="preview" class="preview"><p class="empty">—</p></div>

      <h2 class="preview-title">批量改写标题</h2>
      <div class="batch-box">
        <div class="batch-row">
          <button id="volRemove" class="btn tiny" type="button">去除所有「第X卷」前缀</button>
          <button id="volAdd" class="btn tiny" type="button">为各卷自动加「第X卷」前缀</button>
          <span id="volHint" class="hint"></span>
        </div>
        <div class="batch-row">
          <button id="applyManualVol" class="btn tiny" type="button">按标记加卷前缀</button>
          <span class="hint">先在上方可校正标题栏里，点标题前的「卷」字标记每卷起点（适用于连续编号的书）</span>
        </div>
        <div class="batch-row">
          <input id="findText" type="text" placeholder="查找（勾选右侧可用正则）" class="batch-input"/>
          <input id="replaceText" type="text" placeholder="替换为" class="batch-input"/>
          <label class="chk small"><input id="findRegex" type="checkbox"/>正则</label>
          <button id="applyReplace" class="btn tiny" type="button">应用替换</button>
        </div>
        <p class="hint">改写只影响目录与章节标题显示，不改原文件。每次操作在「已识别标题」基础上叠加；想重来点一次「检测标题」即可。</p>
      </div>

      <h2 class="preview-title">拆分（长书适用）</h2>
      <div class="split-box">
        <select id="splitMode">
          <option value="none">不拆分（整本一本）</option>
          <option value="volume">按卷/部拆分</option>
          <option value="count">每 N 章一本</option>
        </select>
        <input id="splitCount" type="number" min="1" value="50" class="mini-input"/>
        <span class="hint">章/本</span>
        <input id="splitPrefix" type="text" placeholder="文件名前缀（默认书名）" class="mini-input"/>
      </div>

      <div class="actions">
        <button id="generate" class="btn primary" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4"/>
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
          生成并下载 EPUB
        </button>
        <button id="generateSplit" class="btn secondary" type="button" disabled>生成多本并打包 ZIP</button>
        <span id="status" class="status"></span>
      </div>
    </section>
  </main>

  <script src="vendor/jszip.min.js"></script>
  <script src="epub-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
